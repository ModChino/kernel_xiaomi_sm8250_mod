name: Build enuma kernel (SukiSU dual-line + ReSukiSU C line)

# Builds every KernelSU line of the enuma (Xiaomi Pad 5 Pro 5G) MIUI kernel:
#   susfs=0 -> clean line, SukiSU v4.2.0 (4.x, metamodule capable)
#   susfs=1 -> SUSFS line, KernelSU with the in-kernel SUSFS 1.5.7 glue
#   susfs=2 -> C line, ReSukiSU 4.x with SUSFS 2.2.0 (kernel side applied by build.sh
#              on top of this tree's own 1.5.7 code, which it strips first)
# Each job produces one anykernel3 zip named Kernel_MIUI_enuma_*.
#
# The three jobs are independent checkouts (one per matrix arm), which is a hard
# requirement for susfs=2: its first step rewrites fs/ + include/linux/ + kernel/ on
# the tree, and running it in the same workspace as susfs=0/1 would corrupt them.
#
# Scope (t3/M1): only the MIUI variant is built and verified here - every job of
# this workflow pins MIUI_ONLY=1. build.sh's AOSP block (MIUI_ONLY=0) is NOT
# exercised by CI and is therefore unverified in this delivery (the AOSP variant
# is out of scope); it is kept for local/manual use only.
#
# t17: the toolchain is the AOSP clang r487747c prebuilt (banner
# "Android (10087095, +pgo, +bolt, +lto, -mlgo, based on r487747c) clang version
# 17.0.2"), which is the compiler the last known-good released enuma package was
# built with; the repo's documented proton-clang 20210522 is kept only as the
# build.sh default (overridable via TOOLCHAIN_PATH).

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target device (defconfig prefix, e.g. enuma)"
        required: false
        default: "enuma"
        type: string
      miui_only:
        description: "Build the MIUI variant only (1 = yes; 0 = also build AOSP, NOT exercised by CI)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      susfs:
        description: "Which KernelSU line(s) to build as a JSON list (0=clean, 1=SukiSU+SUSFS1.5.7, 2=ReSukiSU+SUSFS2.2.0)"
        required: false
        default: "[0, 1, 2]"
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (susfs=${{ matrix.susfs }})
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Default builds every line; the workflow_dispatch input can narrow it (a
        # cold C-line job is ~25 minutes on its own, so being able to build just it
        # matters). The default is a JSON list because that is what fromJSON consumes.
        susfs: ${{ fromJSON(github.event.inputs.susfs || '[0, 1, 2]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget zip unzip ccache make bc bison flex \
            libssl-dev libelf-dev python3 cpio rsync patch \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          git --version

      - name: Install AOSP clang r487747c (known-good toolchain)
        # Mirror: Arman-ATI/prebuilts_clang_host_linux-x86_clang-r487747c (default
        # branch "main", ~363 MB; bin/clang verified present, 2939268 B, together
        # with ld.lld / llvm-ar / llvm-objcopy).
        # Equivalent mirrors carrying the same prebuilt (bin/clang is the same
        # 2939268 B file): project-raspberry/prebuilts_clang_host_linux-x86_clang-r487747c,
        # halogenOS/android_prebuilts_clang_host_linux-x86_clang-r487747c.
        # build.sh only needs bin/ on PATH plus aarch64-linux-gnu-ld /
        # arm-linux-gnueabi-ld (installed above via binutils-*-linux-gnu).
        run: |
          git clone --depth=1 --single-branch \
            https://github.com/Arman-ATI/prebuilts_clang_host_linux-x86_clang-r487747c "$HOME/aosp-clang"
          test -x "$HOME/aosp-clang/bin/clang"
          "$HOME/aosp-clang/bin/clang" --version > /tmp/clang-banner.txt 2>&1
          cat /tmp/clang-banner.txt
          grep -Eq 'r487747c|clang version 17\.' /tmp/clang-banner.txt \
            || { echo "FATAL: this is not the r487747c clang 17 prebuilt"; exit 1; }
          echo "TOOLCHAIN_PATH=$HOME/aosp-clang/bin" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: ccache-${{ matrix.susfs }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.susfs }}-

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build (WITH_SUSFS=${{ matrix.susfs }})
        env:
          MIUI_ONLY: ${{ inputs.miui_only }}
          WITH_SUSFS: ${{ matrix.susfs }}
        run: |
          set -o pipefail
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_PATH"
          RAW=build-susfs${{ matrix.susfs }}.raw.log
          LOG=build-susfs${{ matrix.susfs }}.log
          # t40/P2-b: clang 17 emits DWARF 5, whose DW_FORM_loclistx (0x22) and
          # DW_FORM_rnglistx (0x23) are unknown to ubuntu-22.04's objdump; it then
          # prints one warning per occurrence (456894 of 464774 A-line log lines in
          # run5 - 98.3%). build.sh also passes -gdwarf-4 now, so this filter is the
          # safety net for whatever remains. The rc is captured (not propagated by
          # `set -e` when it is assigned via `||`) so that both logs always exist,
          # and `exit $rc` preserves exactly today's step result.
          rc=0
          bash build.sh "${{ inputs.device }}" ksu 2>&1 | tee "$RAW" || rc=$?
          awk -v out="$LOG" '
            /objdump: Warning: Unrecognized form: 0x[0-9a-fA-F][0-9a-fA-F]+/ { c1++; if (c1 <= 2) s1 = s1 "\n" $0; next }
            /objdump: Warning: Bogus end-of-siblings marker detected/ { c2++; if (c2 <= 2) s2 = s2 "\n" $0; next }
            /objdump: Warning: Further warnings about bogus end-of-sibling markers suppressed/ { c3++; if (c3 <= 2) s3 = s3 "\n" $0; next }
            { print > out }
            END {
              printf "[log-filter] suppressed %d x \"objdump: Warning: Unrecognized form\" / %d x \"Bogus end-of-siblings\" / %d x \"Further warnings about bogus end-of-sibling markers suppressed\"\n", c1, c2, c3;
              print "[log-filter] sample class 1 (Unrecognized form):" s1;
              print "[log-filter] sample class 2 (Bogus end-of-siblings):" s2;
              print "[log-filter] sample class 3 (suppressed-notice):" s3;
              printf "[log-filter] kept %d lines, dropped %d of %d\n", NR - c1 - c2 - c3, c1 + c2 + c3, NR;
            }' "$RAW" | tee -a "$LOG" || cp "$RAW" "$LOG"
          gzip -9 -c "$RAW" > "$RAW.gz" || true
          ls -l "$LOG" "$RAW" "$RAW.gz" || true
          exit $rc

      - name: Upload kernel zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_MIUI_enuma_susfs${{ matrix.susfs }}-${{ github.run_number }}
          # One glob, and the three product names are disjoint:
          #   susfs=0 -> Kernel_MIUI_enuma_SukiSU_*
          #   susfs=1 -> Kernel_MIUI_enuma_SukiSU-SUSFS_*
          #   susfs=2 -> Kernel_MIUI_enuma_ReSukiSU-SUSFS2_*
          # (they come from build.sh's KSU_ZIP_STR, and the disjointness is checked by
          # the verification task). Anchoring on the prefix keeps exactly one arm's zip
          # in each artifact and cannot silently pick up another line's zip.
          path: Kernel_MIUI_enuma_*.zip
          if-no-files-found: ${{ matrix.susfs == 0 && 'error' || 'ignore' }}

      - name: Upload raw build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # t40/P2-b: the unfiltered log, gzipped (an order of magnitude smaller),
          # so the filtered view never silently loses information.
          name: build-log-raw-susfs${{ matrix.susfs }}
          path: build-susfs${{ matrix.susfs }}.raw.log.gz
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-susfs${{ matrix.susfs }}-${{ github.run_number }}
          path: build-susfs${{ matrix.susfs }}.log
          if-no-files-found: warn
